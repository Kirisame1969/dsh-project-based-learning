name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      # 组合包入口契约：桩 ctx 冒烟（不需要 DSH、不需要装依赖）
      - name: Entry smoke test
        run: node test/entry.smoke.mjs

      # 随包分发的状态模板必须能通过随包分发的校验器
      - name: Validate shipped state template
        run: node skills/dsh-project-based-learning/scripts/validate-learning-state.mjs --state skills/dsh-project-based-learning/assets/state.template.json
